<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>201 · Over the Years</title>

  <style>
    :root {
      --bg: #5a0f1a;
      --bg-dark: #3e0a12;
      --gold: #d4af37;

      --cardW: 336px;
      --cardH: 448px;

      --radius: 20px;
      --speed: 95;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      background:
        radial-gradient(
          1000px 600px at 50% 26%,
          rgba(255,255,255,0.08),
          transparent 62%
        ),
        linear-gradient(180deg, var(--bg), var(--bg-dark));
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: white;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== HEADER ===== */
    .header {
      text-align: center;
      margin-top: 26px;
      margin-bottom: 16px;
      user-select: none;
    }

    .unit {
      font-size: 66px;
      font-weight: 900;
      letter-spacing: 6px;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 20px;
      letter-spacing: 6px;
      opacity: 0.85;
      text-transform: uppercase;
    }

    .divider {
      width: 320px;
      height: 2px;
      margin: 16px auto 22px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      box-shadow:
        0 0 6px rgba(212,175,55,0.6),
        0 0 14px rgba(212,175,55,0.45);
    }

    /* ===== STAGE ===== */
    .stage {
      width: min(1600px, 96vw);
      height: 760px;
      position: relative;
    }

    /* ===== GOLD CURTAINS ===== */
    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      top: 0;
      height: 100%;
      width: 30%;
      z-index: 5;
      pointer-events: none;
      mix-blend-mode: screen;
      will-change: transform, opacity;
    }

    /* LEFT GOLD CURTAIN */
    .stage::before {
      left: 0;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(212,175,55,0.35) 0px,
          rgba(212,175,55,0.15) 22px,
          rgba(212,175,55,0.35) 44px
        ),
        radial-gradient(
          90% 140% at 0% 50%,
          rgba(212,175,55,0.85),
          rgba(212,175,55,0.35) 45%,
          rgba(212,175,55,0.0) 75%
        );
      animation: goldCurtainLeft 6s ease-in-out infinite;
      transform-origin: left center;
    }

    /* RIGHT GOLD CURTAIN */
    .stage::after {
      right: 0;
      background:
        repeating-linear-gradient(
          270deg,
          rgba(212,175,55,0.35) 0px,
          rgba(212,175,55,0.15) 22px,
          rgba(212,175,55,0.35) 44px
        ),
        radial-gradient(
          90% 140% at 100% 50%,
          rgba(212,175,55,0.85),
          rgba(212,175,55,0.35) 45%,
          rgba(212,175,55,0.0) 75%
        );
      animation: goldCurtainRight 6.6s ease-in-out infinite;
      transform-origin: right center;
    }

    @keyframes goldCurtainLeft {
      0%, 100% {
        opacity: 0.85;
        transform: translateX(0px) scaleX(1);
      }
      50% {
        opacity: 1;
        transform: translateX(14px) scaleX(0.96);
      }
    }

    @keyframes goldCurtainRight {
      0%, 100% {
        opacity: 0.85;
        transform: translateX(0px) scaleX(1);
      }
      50% {
        opacity: 1;
        transform: translateX(-14px) scaleX(0.96);
      }
    }

    .track {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .card {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--cardW);
      text-align: center;
      transform-origin: center;
      will-change: transform, opacity;
      filter: drop-shadow(0 34px 110px rgba(0,0,0,0.6));
      pointer-events: none;
    }

    .image {
      width: 100%;
      height: var(--cardH);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.20);
      background: rgba(255,255,255,0.06);
    }

    .image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .name {
      margin-top: 14px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .years {
      margin-top: 5px;
      font-size: 15px;
      opacity: 0.86;
      letter-spacing: 0.4px;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="unit">201</div>
    <div class="subtitle">over the years</div>
    <div class="divider"></div>
  </div>

  <div class="stage" id="stage">
    <div class="track" id="track"></div>
  </div>

  <script>
    const slides = [
      { name: "Alton C Rowe, Sr.", years: "1911-1933", src: "images/Alton Rowe Sr.JPEG" },
      { name: "F. Harris Patterson", years: "1934-1939", src: "images/F. Harris Patterson.JPEG" },
      { name: "Bradford B. Banfield", years: "1939-1944", src: "images/Bradford Banfield.JPEG" },
      { name: "Leonard C. Smith", years: "1944-1945", src: "images/Leonard Smith.JPEG" },
      { name: "John A. Hotaling", years: "1946-1947", src: "images/John Hotaling.JPEG" },
      { name: "Charles Sutter", years: "1951", src: "images/Charles Sutter.JPEG" },
      { name: "Blake Case", years: "1956-1960", src: "images/Blake Case.JPEG" },
      { name: "David N. Languish", years: "2003-2004", src: "images/Dave.JPEG" }
    ];

    const track = document.getElementById("track");
    const stage = document.getElementById("stage");

    const speed = 95;
    let spacing = 416;
    let nextIndex = 0;
    const cards = [];

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function exitX() { return stage.clientWidth / 2 + spacing * 1.4; }
    function spawnLeftX() { return -exitX() - spacing; }

    function styleFromX(x) {
      const e = exitX();
      const t = 1 - clamp(Math.abs(x) / e, 0, 1);
      const ease = t * t * t;

      return {
        scale: 0.9 + ease * 0.65,
        opacity: 0.18 + ease * 0.82,
        z: Math.round(ease * 1000),
      };
    }

    function render(el, slide) {
      el.innerHTML = `
        <div class="image"><img src="${slide.src}" alt="${slide.name}"></div>
        <div class="name">${slide.name}</div>
        <div class="years">${slide.years}</div>
      `;
    }

    function build() {
      track.innerHTML = "";
      cards.length = 0;

      let x = spawnLeftX();
      for (let i = 0; i < Math.min(slides.length, 9); i++) {
        const el = document.createElement("div");
        el.className = "card";
        render(el, slides[nextIndex]);
        nextIndex = (nextIndex + 1) % slides.length;
        track.appendChild(el);
        cards.push({ el, x });
        x += spacing;
      }
    }

    let last = performance.now();
    function tick(now) {
      const dt = (now - last) / 1000;
      last = now;

      for (const c of cards) c.x += speed * dt;

      for (const c of cards) {
        if (c.x > exitX()) {
          const minX = Math.min(...cards.map(k => k.x));
          c.x = minX - spacing;
          render(c.el, slides[nextIndex]);
          nextIndex = (nextIndex + 1) % slides.length;
        }
      }

      for (const c of cards) {
        const { scale, opacity, z } = styleFromX(c.x);
        c.el.style.zIndex = z;
        c.el.style.opacity = opacity;
        c.el.style.transform =
          `translate(calc(-50% + ${c.x}px), -50%) scale(${scale})`;
      }

      requestAnimationFrame(tick);
    }

    build();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
